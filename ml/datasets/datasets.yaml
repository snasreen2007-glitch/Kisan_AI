def save_manifest():
    out_path = "ml/datasets/datasets.yaml"
    with open(out_path, "w", encoding="utf-8") as f:
        yaml.dump(DATASET_REGISTRY, f, sort_keys=False, indent=2)
    print(f"Saved dataset registry manifest -> {out_path}")

if __name__ == "__main__":
    save_manifest()

